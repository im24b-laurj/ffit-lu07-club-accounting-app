spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/localdb
    username: ${db.username}
    password: ${db.password}
  jpa:
    hibernate:
      ddl-auto: update
    # SQL goes through the logger (see logging.level.org.hibernate.SQL) instead of System.out
    show-sql: false
    properties:
      hibernate.format_sql: true
